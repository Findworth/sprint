name: 使用问题
description: 反馈 SprintAI 使用过程中遇到的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: SprintAI 版本
      placeholder: 例如 v0.1.0
    validations:
      required: true

  - type: dropdown
    id: windows
    attributes:
      label: Windows 版本
      options:
        - Windows 11
        - Windows 10
        - 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明你进行了什么操作、预期看到什么、实际发生了什么
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: 截图或日志
      description: 请先移除 API Key、个人信息和其他敏感内容
