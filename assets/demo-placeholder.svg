<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SprintAI 产品演示占位图</title>
  <desc id="desc">产品演示视频或 GIF 即将添加</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10111a"/>
      <stop offset="100%" stop-color="#1b1630"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="28" fill="url(#background)"/>
  <rect width="1280" height="720" rx="28" fill="url(#glow)"/>
  <rect x="96" y="88" width="1088" height="544" rx="24" fill="#151620" stroke="#343044" stroke-width="2" filter="url(#shadow)"/>

  <g transform="translate(640 280)">
    <circle r="76" fill="#211b36" stroke="#8b5cf6" stroke-width="3"/>
    <path d="M-22-34 42 0-22 34Z" fill="#a78bfa"/>
  </g>

  <text x="640" y="432" text-anchor="middle" fill="#f5f3ff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="54" font-weight="700">SprintAI</text>
  <text x="640" y="492" text-anchor="middle" fill="#b9b4c9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="27">产品演示视频 / GIF 即将添加</text>
  <text x="640" y="552" text-anchor="middle" fill="#777184" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19">Define · Diverge · Decide</text>
</svg>
